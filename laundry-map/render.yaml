# Free web service only. Do not add a disk and do not change plan to starter.
# The live service is already on Render Free without a disk. This file is not applied automatically.
# Cloud persistence uses PERSIST_* environment variables set in the dashboard, not a paid disk.
services:
  - type: web
    name: mcw-laundry-map
    runtime: node
    rootDir: laundry-map
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/stores
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/mcw-data
      - key: GEOCODE_ON_START
        value: "true"
      - key: ADMIN_USER
        value: hq
      - key: ADMIN_PASSWORD
        sync: false
